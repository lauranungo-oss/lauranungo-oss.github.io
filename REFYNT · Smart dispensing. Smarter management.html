<div class="g2"><div class="c"><h3>Consumo por semana (ml)</h3>${cols(grp(CONS,"w"))}</div><div class="c"><h3>Consumo por producto (ml)</h3>${hb(by(CONS,pn))}</div><div class="c"><h3>Distribución del inventario</h3>${donut([["Adecuado",c("a"),"var(--ok)"],["Bajo",c("b"),"var(--wa)"],["Urgente",c("u"),"var(--er)"]])}</div><div class="c"><h3>Estado de los dispositivos</h3>${donut([["Conectados",on,"var(--ok)"],["Desconectados",DEV.length-on,"var(--er)"]])}</div></div>`},
disp:()=>{const q=S.q.toLowerCase(),vs=[...new Set(DEV.map(v=>v.loc.split(" – ")[0]))],L=DEV.map((v,i)=>[v,i]).filter(([v])=>(!S.fl||v.loc.startsWith(S.fl))&&(S.fs===""||v.c==S.fs)&&(v.id+v.n+v.loc+v.p.map(p=>p[0]).join()).toLowerCase().includes(q));
return`<h2>Dispensadores</h2><div class="tl"><input data-m="q" value="${esc(S.q)}" placeholder="Buscar por ID, nombre, ubicación o producto…">${sel("fl",S.fl,[["","Todas las ubicaciones"],...vs.map(x=>[x,x])])}${sel("fs",S.fs,[["","Todos los estados"],["1","Conectado"],["0","Desconectado"]])}</div><div class="c">${tb(["ID","Nombre","Ubicación","Tipo","Productos","Conexión","Nivel mínimo","Actualización"],L.map(([v])=>{const m=Math.min(...v.p.map(pct));return[v.id,v.n,v.loc,v.t,v.p.map(p=>p[0]).join(", "),cb(v.c),pbar(m)+m+" %",v.u]}),L.map(x=>x[1]))}</div><p style="color:var(--mu);font-size:13px">Selecciona una fila para ver la ficha del dispensador.</p>`},
inv:()=>{const q=S.iq.toLowerCase(),R=DEV.flatMap(v=>v.p.map(p=>[v,p])).filter(([v,p])=>(!S.is||st(pct(p))==S.is)&&(p[0]+v.loc+v.id).toLowerCase().includes(q));
return`<h2>Inventario</h2><div class="tl"><input data-m="iq" value="${esc(S.iq)}" placeholder="Buscar producto o ubicación…">${sel("is",S.is,[["","Todos los estados"],["a","Adecuado"],["b","Nivel bajo"],["u","Reposición urgente"]])}</div><div class="c">${tb(["Producto","Dispensador","Ubicación","Disponible","Restante","Estado"],R.map(([v,p])=>[p[0],v.id,v.loc,n(p[1])+" ml",pbar(pct(p))+pct(p)+" %",badge(pct(p))]))}</div>`},
cons:()=>{const r=cf(),g=grp(r,S.g),hist=[...new Set(r.map(c=>c.d))].sort((a,b)=>b-a).slice(0,10).map(d=>{const x=r.filter(c=>c.d==d);return[dl(d),n(sum(x))+" ml",by(x,pn)[0][0]]});
return`<h2>Consumo</h2><div class="tl">${sel("range",S.range,[[7,"Últimos 7 días"],[14,"Últimos 14 días"],[30,"Últimos 30 días"]])}${sel("g",S.g,[["d","Diario"],["w","Semanal"],["m","Mensual"]])}${sel("cp",S.cp,[["","Todos los productos"],...PR.map(x=>[x,x])])}${sel("cd",S.cd,[["","Todas las ubicaciones"],...DEV.map((v,i)=>[i,v.loc])])}</div>
<div class="c"><h3>Consumo ${{d:"diario",w:"semanal",m:"mensual"}[S.g]} · total ${n(sum(r))} ml</h3>${g.length>1?ln(g):cols(g)}</div><div class="g2"><div class="c"><h3>Por producto (ml)</h3>${hb(by(r,pn))}</div><div class="c"><h3>Por ubicación (ml)</h3>${hb(by(r,c=>DEV[c.i].loc))}</div></div><div class="c" style="margin-top:18px"><h3>Historial de utilización</h3>${tb(["Fecha","Total","Producto más usado"],hist)}</div>`},
alert:()=>{const L=AL.map((a,i)=>[a,i]).filter(([a])=>S.af=="t"||(S.af=="p"?!a.done:a.done));
return`<h2>Alertas</h2><div class="tl">${sel("af",S.af,[["p","Pendientes"],["a","Atendidas"],["t","Todas"]])}</div>${L.map(([a,i])=>`<div class="al ${a.done?"done":""}"><div class="ib" style="background:${a.s=="b"?"#fbf0cc":"#f8dcda"};color:#7a2b27">${I(a.s=="d"?"wifi":"bell")}</div><div><b>${a.tx}</b><br><small>${a.t}${a.done?" · Atendida":""}</small></div>${a.done?"":`<button class="btn sm" data-a="att" data-i="${i}">Marcar atendida</button>`}</div>`).join("")||`<div class="c">No hay alertas en esta vista.</div>`}`},
rep:()=>{const f=S.rf,v=DEV[f.dev];return`<h2>Reposiciones</h2><div class="c"><h3>Registrar reposición</h3><div class="fg"><label>Fecha<input type="date" data-m="rf.f" value="${f.f}"></label><label>Dispensador${sel("rf.dev",f.dev,DEV.map((d,i)=>[i,d.id+" · "+d.n]))}</label><label>Ubicación<input disabled value="${v.loc}"></label><label>Producto rellenado${sel("rf.pr",f.pr,v.p.map((p,i)=>[i,p[0]]))}</label><label>Cantidad agregada (ml)<input type="number" min="1" data-m="rf.ml" value="${f.ml}"></label><label>Responsable<input data-m="rf.resp" value="${esc(f.resp)}"></label></div><button class="btn p" data-a="addrf">Registrar reposición</button></div><div class="c" style="margin-top:18px"><h3>Historial</h3>${tb(["Fecha","Ubicación","Producto","ml","Responsable"],RF.map(x=>[x.f,DEV[x.dev].loc,DEV[x.dev].p[x.pr][0],x.ml,esc(x.resp)]))}</div>`},

return`<h2>Reportes</h2><div class="tabs">${T2.map(t=>`<button class="btn sm ${S.rt==t[0]?"p":""}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join("")}<button class="btn sm" style="margin-left:auto" data-a="csv">${I("file")}Exportar CSV</button></div><div class="c">${tb(r.h,r.r)}</div>`},
conf:()=>`<h2>Configuración</h2><div class="g2"><div class="c"><h3>Umbrales de inventario (%)</h3><div class="fg"><label>Reposición urgente (≤)<input type="number" min="1" max="50" data-m="T.r" value="${T.r}"></label><label>Nivel bajo (≤)<input type="number" min="1" max="90" data-m="T.l" value="${T.l}"></label></div><p style="color:var(--mu)">Los indicadores verde, amarillo y rojo se recalculan en toda la plataforma.</p></div><div class="c"><h3>Apariencia</h3><label>Tema${sel("th",S.th,[["auto","Automático"],["light","Claro"],["dark","Oscuro"]])}</label></div><div class="c"><h3>Arquitectura preparada</h3><p style="color:var(--mu);margin:0">Los datos viven separados de la interfaz (DEV, AL, RF, CONS). Para producción se reemplazan por llamadas a una API REST, ingesta de sensores IoT (p. ej. MQTT) y una base de datos. Hoy nada de esto está conectado.</p></div></div>`};

function setM(p,v){const k=p.split(".");if(k[0]=="T"){T[k[1]]=+v||0;return}if(p=="rf.dev"||p=="rf.pr")v=+v;let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;if(p=="rf.dev")S.rf.pr=0}
function render(){const a=document.activeElement,id=a&&a.dataset&&a.dataset.m,pos=a&&a.selectionStart,pg=(location.hash.slice(1)||"inicio");

app.innerHTML=h+FOOT;document.querySelectorAll("#nav a:not(.btn)").forEach(l=>l.classList.toggle("on",l.getAttribute("href")=="#"+pg));$("#nav").classList.toggle("o",!!S.menu);

const toast=t=>{const e=$("#tt");e.textContent=t;e.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(()=>e.style.display="none",2600)};
function addrf(){const f=S.rf,ml=+f.ml;if(!(ml>0)||f.resp.trim().length<2||!f.f)return toast("Completa fecha, cantidad (>0) y responsable");const p=DEV[f.dev].p[f.pr];p[1]=Math.min(p[2],p[1]+ml);RF.unshift({...f,ml});AL.forEach(a=>{if(a.dev==f.dev&&a.pr==f.pr)a.done=1});S.rf.ml="";S.rf.resp="";render();toast("Reposición registrada: inventario actualizado")}
